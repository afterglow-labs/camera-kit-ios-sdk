name: Offline input regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/offline-input-queue

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify bounded Lens hashing memory
        run: |
          xcrun swiftc \
            Sources/SCSDKCameraKitLocalLens/LocalLensFileHasher.swift \
            Tests/LocalLensFileHasherTests/main.swift \
            -o /tmp/local-lens-file-hasher-tests
          /tmp/local-lens-file-hasher-tests
      - name: Select an available iPhone simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device["name"].startswith("iPhone")))')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run offline input transition regression
        run: |
          xcodebuild test \
            -scheme CameraKit-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:SCSDKCameraKitLocalLensTests/OfflineInputTransitionCoordinatorTests
      - name: Run camera chrome visibility regression
        run: |
          xcodebuild test \
            -scheme CameraKit-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:SCSDKCameraKitLocalLensTests/CameraChromeVisibilityTests
