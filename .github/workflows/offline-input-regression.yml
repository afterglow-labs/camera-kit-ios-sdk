name: Offline input regression

on:
  push:
    branches:
      - codex/offline-input-queue

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device["name"].startswith("iPhone")))')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run offline input transition regression
        run: |
          xcodebuild test \
            -scheme CameraKit-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:SCSDKCameraKitLocalLensTests/OfflineInputTransitionCoordinatorTests
